# Modified personal fork: publish the UI only. Analysis and mail run locally.
name: Private digest website
on:
  push:
    branches: [main]
    paths: ['personal/web/**', 'personal/build.mjs', 'personal/package.json', 'personal/pnpm-lock.yaml', 'personal/pnpm-workspace.yaml', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm --dir personal install --frozen-lockfile
      - run: pnpm --dir personal test
      - run: pnpm --dir personal build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: personal/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public UI
        id: deployment
        uses: actions/deploy-pages@v4
