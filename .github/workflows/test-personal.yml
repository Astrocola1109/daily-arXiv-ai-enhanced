name: Personal digest tests
on:
  push:
    paths: ['personal/**', '.github/workflows/test-personal.yml']
  pull_request:
    paths: ['personal/**', '.github/workflows/test-personal.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r personal/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
        working-directory: personal
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm --dir personal install --frozen-lockfile
      - run: pnpm --dir personal test
      - run: pnpm --dir personal build
